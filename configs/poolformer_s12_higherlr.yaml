# config.yaml

# Training Parameters
batch_size: 4
batch_size_valid: 8
epochs: 120
lr: 0.00008
weight_decay: 0.0001
rand_seed: 42
precisionHigh: true

# Dataset Configuration
train_dir: /root/data-tmp/COD/Train
test_dir: /root/data-tmp/COD/Test/COD10K
load_all: false

# Model Configuration
backbone: poolformer_s12
img_size: 416
lateral_channels: [512, 320, 128, 64]
resume: "/root/data-tmp/ESCNet/checkpoints/poolformer_s12_higherlr/latest.ckpt"
compile: false

# Learning-rate schedule
lr_scheduler:
  type: cosine
  step_unit: iter
  warmup_epochs: 5
  warmup_start_factor: 0.3
  min_lr_factor: 0.5
  power: 0.9

# Teacher-Student Distillation
distillation:
  enabled: true
  teacher_checkpoint: /root/data-tmp/epoch_120.pth
  teacher_backbone: pvt_v2_b5
  teacher_lateral_channels: [512, 320, 128, 64]
  temperature: 2.0
  hard_loss_weight: 1.0
  mask_loss_weight: 0.3
  edge_loss_weight: 0.1
  feature_loss_weight: 0.05
  feature_mse_weight: 1.0
  feature_attention_weight: 0.5

# Periodic evaluation during training
eval_during_training:
  enabled: true
  interval: 10
  pred_root: /root/data-tmp/preds_train
  save_dir: /root/data-tmp/results_train
  keep_predictions: true
  run_at_end: true

# Multi-GPU Settings
device_ids: [0, 1, 2, 3]
multi_GPU: true

# Save Settings
save_model_dir: /root/data-tmp/ESCNet/checkpoints
name: null
save_last: 80
save_step: 10

# Data Augmentation
preproc_methods:
  - flip
  - rotate
  - pepper
  - crop

# Path Settings
weights:
  poolformer_s12: /root/data-tmp/weights/poolformer_s12.timm.pth
  pvt_v2_b5: /root/data-tmp/weights/pvt_v2_b5_22k.pth

# System
num_workers: 4
