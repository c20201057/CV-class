# config.yaml

# Training Parameters
batch_size: 4
batch_size_valid: 8
epochs: 120
lr: 0.00003
weight_decay: 0.0001
rand_seed: 42
precisionHigh: true

# Dataset Configuration
train_dir: /root/data-tmp/COD/Train
test_dir: /root/data-tmp/COD/Test/COD10K
load_all: false

# Model Configuration
backbone: pvt_v2_b0
img_size: 416
lateral_channels: [256, 160, 64, 32]
resume: ""
compile: false

# Learning-rate schedule
lr_scheduler:
  type: cosine
  step_unit: iter
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr_factor: 0.1
  power: 0.9

# Teacher-Student Distillation
distillation:
  enabled: true
  teacher_checkpoint: /root/data-tmp/epoch_120.pth
  teacher_backbone: pvt_v2_b5
  teacher_lateral_channels: [512, 320, 128, 64]
  temperature: 2.0
  hard_loss_weight: 1.0
  mask_loss_weight: 0.3
  edge_loss_weight: 0.1

# Periodic evaluation during training
eval_during_training:
  enabled: true
  interval: 20
  pred_root: /root/data-tmp/preds_train
  save_dir: /root/data-tmp/results_train
  keep_predictions: true
  run_at_end: true

# Multi-GPU Settings
device_ids: [0, 1, 2, 3]
multi_GPU: true

# Save Settings
save_model_dir: /root/data-tmp/ESCNet/checkpoints
name: null
save_last: 80
save_step: 20

# Data Augmentation
preproc_methods:
  - flip
  - rotate
  - pepper
  - crop

# Path Settings
weights:
  pvt_v2_b0: /root/data-tmp/weights/pvt_v2_b0.pth
  # pvt_v2_b1: /data/studnet/ys/weights/pvt_v2_b1.pth
  # pvt_v2_b2: /data/studnet/ys/weights/pvt_v2_b2.pth
  # pvt_v2_b3: /data/studnet/ys/weights/pvt_v2_b3.pth
  # pvt_v2_b4: /data/studnet/ys/weights/pvt_v2_b4.pth
  pvt_v2_b5: /root/data-tmp/weights/pvt_v2_b5_22k.pth

# System
num_workers: 4
