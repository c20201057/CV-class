# Lite-ESCNet-B0 with a lightweight FPN decoder.

batch_size: 8
batch_size_valid: 8
epochs: 80
lr: 0.000075
weight_decay: 0.0001
rand_seed: 42
precisionHigh: true

train_dir: /root/data-tmp/COD/Train
test_dir: /root/data-tmp/COD/Test/COD10K
load_all: false

backbone: pvt_v2_b0
img_size: 416
lateral_channels: [256, 160, 64, 32]
decoder_type: light_fpn
escnet_width: 96
resume: ""
compile: false

lr_scheduler:
  type: cosine
  step_unit: iter
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr_factor: 0.1
  power: 0.9

distillation:
  enabled: true
  teacher_checkpoint: /root/data-tmp/weights/epoch_50.pth
  teacher_backbone: pvt_v2_b0
  teacher_lateral_channels: [256, 160, 64, 32]
  teacher_decoder_type: escnet
  teacher_escnet_width: 128
  temperature: 2.0
  hard_loss_weight: 1.0
  mask_loss_weight: 0.5
  edge_loss_weight: 0.2
  feature_loss_weight: 0.0

eval_during_training:
  enabled: true
  interval: 10
  pred_root: /root/data-tmp/escnet_runs/preds_train
  save_dir: /root/data-tmp/escnet_runs/results_train
  keep_predictions: false
  run_at_end: true

device_ids: [0]
multi_GPU: false

save_model_dir: /root/data-tmp/escnet_runs/checkpoints
name: pvt_v2_b0_light_fpn
save_last: 40
save_step: 10

preproc_methods:
  - flip
  - rotate
  - pepper
  - crop

weights:
  pvt_v2_b0: /root/data-tmp/weights/pvt_v2_b0.pth
  pvt_v2_b5: /root/data-tmp/weights/pvt_v2_b5_22k.pth

num_workers: 4
