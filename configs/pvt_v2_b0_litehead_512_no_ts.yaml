# config.yaml

# Training Parameters
batch_size: 4
batch_size_valid: 8
epochs: 120
lr: 0.00008
weight_decay: 0.0001
structure_loss_type: weighted
structure_loss_weight: 1.0
edge_supervision_weight: 1.2
mask_level_weights: [0.4, 0.7, 1.0, 1.5]
mask_edge_consistency_weight: 0.05
rand_seed: 42
precisionHigh: true

# Dataset Configuration
train_dir: /root/data-tmp/COD/Train
test_dir: /root/data-tmp/COD/Test/COD10K
load_all: false

# Model Configuration
architecture: lite_escnet
backbone: pvt_v2_b0
img_size: 512
lateral_channels: [256, 160, 64, 32]
lite_head_channels: 64
resume: null
resume_optimizer: true
resume_lr_scheduler: true
resume_scaler: true
resume_epoch: true
resume_strict: true
compile: false

# Learning-rate schedule
lr_scheduler:
  type: cosine
  step_unit: iter
  warmup_epochs: 5
  warmup_start_factor: 0.1
  min_lr_factor: 0.1
  power: 0.9

# Teacher-Student Distillation
distillation:
  enabled: false

# Periodic evaluation during training
eval_during_training:
  enabled: true
  interval: 10
  pred_root: /root/data-tmp/preds_train
  save_dir: /root/data-tmp/results_train
  keep_predictions: false
  run_at_end: true

# Multi-GPU Settings
device_ids: [0, 1, 2, 3]
multi_GPU: true

# Save Settings
save_model_dir: /root/data-tmp/ESCNet/checkpoints
name: pvt_v2_b0_litehead_512_no_ts
save_last: 60
save_step: 10

# Data Augmentation
preproc_methods:
  - flip
  - rotate
  - pepper
  - crop
  - enhance

# Path Settings
weights:
  pvt_v2_b0: /root/data-tmp/weights/pvt_v2_b0.pth

# System
num_workers: 4
