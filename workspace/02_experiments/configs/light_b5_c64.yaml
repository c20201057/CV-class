# Decoder-width ablation: PVTv2-B5 with narrowed decoder C64.

batch_size: 4
batch_size_valid: 8
epochs: 60
lr: 0.000075
weight_decay: 0.00015
rand_seed: 42
precisionHigh: true

train_dir: /root/data-tmp/COD/Train
test_dir: /root/data-tmp/COD/Test/COD10K
load_all: false

backbone: pvt_v2_b5
img_size: 416
lateral_channels: [512, 320, 128, 64]
inter_channel: 64
bb_pretrained: true
resume: ""
compile: false

device_ids: [0]
multi_GPU: false

save_model_dir: /root/data-tmp/workspace/02_experiments/runs
name: light_b5_c64_e60_s42
save_last: 15
save_step: 3

preproc_methods:
  - flip
  - rotate
  - pepper
  - crop

weights:
  pvt_v2_b2: /root/data-tmp/weights/pvt_v2_b2.pth
  pvt_v2_b4:
  pvt_v2_b5: /root/data-tmp/weights/pvt_v2_b5_22k.pth

num_workers: 4
