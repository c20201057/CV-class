# Light-ESCNet B2-C64

# Training Parameters
batch_size: 4
batch_size_valid: 8
epochs: 120
lr: 0.000075
weight_decay: 0.00015
rand_seed: 42
precisionHigh: true

# Dataset Configuration
train_dir: /root/data-tmp/COD/Train
test_dir: /root/data-tmp/COD/Test/COD10K
load_all: false

# Model Configuration
backbone: pvt_v2_b2
img_size: 416
lateral_channels: [512, 320, 128, 64]
inter_channel: 64
bb_pretrained: true
resume: ""
compile: false

# Multi-GPU Settings
device_ids: [0]
multi_GPU: false

# Save Settings
save_model_dir: /root/data-tmp/workspace/02_experiments/runs
name: light_b2_c64_e120_s42
save_last: 30
save_step: 3

# Data Augmentation
preproc_methods:
  - flip
  - rotate
  - pepper
  - crop

# Path Settings
weights:
  pvt_v2_b2: /root/data-tmp/weights/pvt_v2_b2.pth
  pvt_v2_b4:
  pvt_v2_b5: /root/data-tmp/weights/pvt_v2_b5_22k.pth

# System
num_workers: 4
